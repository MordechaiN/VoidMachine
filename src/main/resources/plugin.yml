name: VoidMachine
version: '${version}'
main: com.voidmachine.VoidMachinePlugin
api-version: '26.2'
folia-supported: false
load: POSTWORLD
author: Mordechai Neeman
description: A ritual machine that swallows an offering and decides its fate. Crash-safe custody, cinematic reveals, Bedrock-friendly.
website: https://github.com/MordechaiNeeman/VoidMachine
# Optional: used only to detect Bedrock players precisely. Without them a UUID heuristic is used.
softdepend:
  - floodgate
  - Geyser-Spigot

commands:
  voidmachine:
    description: VoidMachine player and admin commands.
    usage: /voidmachine help
    aliases: [vm]

permissions:
  voidmachine.*:
    description: Every VoidMachine permission.
    default: op
    children:
      voidmachine.use: true
      voidmachine.stats: true
      voidmachine.claim: true
      voidmachine.notify: true
      voidmachine.bypass.cooldown: true
      voidmachine.admin: true
  voidmachine.use:
    description: Offer items to a Void Machine.
    default: true
  voidmachine.stats:
    description: View your own statistics, server statistics and leaderboards.
    default: true
  voidmachine.claim:
    description: Collect rewards the Void is holding for you (e.g. after a full inventory).
    default: true
  voidmachine.notify:
    description: Receive server-wide announcements of great wins and jackpots.
    default: true
  voidmachine.bypass.cooldown:
    description: Ignore player and machine cooldowns.
    default: op
  voidmachine.admin:
    description: Full administration (create/remove machines, resolve and refund records, reload).
    default: op
    children:
      voidmachine.admin.inspect: true
      voidmachine.admin.alerts: true
  voidmachine.admin.inspect:
    description: Read-only administration (list, status, pending, inspect, diagnostics, odds).
    default: op
  voidmachine.admin.alerts:
    description: Receive recovery and safety alerts in chat (always also written to the server log).
    default: op
