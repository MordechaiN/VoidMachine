# =============================================================================
#  VoidMachine 2 — configuration
#
#  Validated on every start and on /vm admin reload. If anything here is invalid,
#  VoidMachine tells you exactly what and where in the console, keeps working for
#  recovery and admin commands, and refuses new offerings until it is fixed.
#
#  Visual choreography (themes, jackpot variants, pacing) lives in rituals.yml.
#  Player-facing text lives in lang/<language>.yml.
# =============================================================================
config-version: 2

# -----------------------------------------------------------------------------
#  Language
# -----------------------------------------------------------------------------
language:
  # Language for players whose client language has no translation, and for broadcasts.
  # Bundled: he, en
  default: he
  # Use each player's own client language when a translation exists.
  use-client-language: true
  # Bedrock clients draw all text left-to-right, which reverses Hebrew. When true,
  # Hebrew is pre-ordered for Bedrock players only (Java players get normal text).
  bedrock-rtl-fix: true

# -----------------------------------------------------------------------------
#  Machines
# -----------------------------------------------------------------------------
machines:
  # Block that becomes the machine when an admin runs /vm admin create.
  # RESPAWN_ANCHOR is recommended: its charge glow is used for the ritual visuals.
  core-block: RESPAWN_ANCHOR
  max-machines: 10
  # Worlds where machines work. Empty = every world. blocked-worlds wins.
  allowed-worlds: []
  blocked-worlds: []
  # Creative players can conjure items, so they cannot make offerings by default.
  allow-creative: false
  # Minimum time between two interactions of the same player (anti-spam).
  interact-cooldown-ms: 400

# -----------------------------------------------------------------------------
#  What can be offered
# -----------------------------------------------------------------------------
offering:
  # Most items one offering may contain (one inventory slot, 1-99).
  max-amount: 64
  # Never accepted.
  blocked-materials:
    - WRITTEN_BOOK
    - WRITABLE_BOOK
    - KNOWLEDGE_BOOK
    - FILLED_MAP
  # Shulker boxes and bundles that contain items are refused: multiplying them would multiply their contents.
  block-filled-containers: true
  # Refuse tools, armour and other unstackable items.
  block-unstackable: false
  # Items carrying any of these persistent-data keys are refused (mark items from other plugins here).
  blocked-pdc-keys:
    - "voidmachine:locked"

# -----------------------------------------------------------------------------
#  Hard limits (safety and performance budgets)
# -----------------------------------------------------------------------------
limits:
  # Most items one ritual can ever return. Must be >= offering.max-amount.
  max-reward-amount: 320
  # Rituals running at the same time on the whole server.
  max-active-rituals: 4
  # Rewards the Void may hold for one player while their inventory is full.
  max-unclaimed-per-player: 5
  # Safety net: a ritual that runs longer than this is resolved immediately (ticks; 20 = 1 s).
  max-ritual-duration-ticks: 900
  # Spectators who receive effects of one ritual (closest first).
  max-spectators-per-ritual: 32
  # Presentation budget per server tick, shared by all rituals. When exceeded,
  # effects are thinned out — gameplay is never affected.
  max-particles-per-tick: 1200
  max-packets-per-tick: 400
  # Floating display entities per ritual (Java clients only).
  max-display-entities-per-ritual: 3

# -----------------------------------------------------------------------------
#  Cooldowns (permission voidmachine.bypass.cooldown skips them)
# -----------------------------------------------------------------------------
cooldowns:
  # After a ritual ends, the same player must wait this long.
  player-seconds: 8
  # After a ritual ends, the same machine rests this long.
  machine-seconds: 0

# -----------------------------------------------------------------------------
#  Outcomes: what the Void can decide
#
#  multiplier: items returned per item offered (0, 0.5, 1, 2, 1/2 ...). Rounded down.
#  tier:       how the reveal is staged. Must agree with the multiplier:
#                loss = 0 | partial = between 0 and 1 | neutral = 1 | win / great / jackpot = above 1
# -----------------------------------------------------------------------------
outcomes:
  consumed: { multiplier: 0,   tier: loss }
  tithe:    { multiplier: 0.5, tier: partial }
  returned: { multiplier: 1,   tier: neutral }
  doubled:  { multiplier: 2,   tier: win }
  tripled:  { multiplier: 3,   tier: great }
  jackpot:  { multiplier: 5,   tier: jackpot }

# -----------------------------------------------------------------------------
#  Machine profiles
#
#  weights are relative (they do not need to add up to 100). Every player sees the
#  same odds on the same machine; odds never depend on who is watching.
#  Run /vm admin odds <profile> to see the resulting percentages and expected return.
#
#  theme / pacing: ids from rituals.yml.
#  permission:     optional extra permission needed to use machines with this profile.
# -----------------------------------------------------------------------------
profiles:
  default:
    weights: { consumed: 64, tithe: 10, returned: 20, doubled: 4, tripled: 1.8, jackpot: 0.2 }
    theme: void
    pacing: standard
    permission: ""
  brutal:
    weights: { consumed: 82, tithe: 8, returned: 8, doubled: 1.5, tripled: 0.4, jackpot: 0.1 }
    theme: void
    pacing: epic
    permission: ""
  unstable:
    weights: { consumed: 52, tithe: 8, returned: 22, doubled: 12, tripled: 4.5, jackpot: 1.5 }
    theme: void
    pacing: swift
    permission: ""

# -----------------------------------------------------------------------------
#  Presentation
# -----------------------------------------------------------------------------
presentation:
  # Open a "ritual chamber" inventory during the ritual. Off by default: the drama
  # happens in the world, and a chest screen would hide it (especially on Bedrock).
  ritual-chamber-gui: false
  # Keep the offering player near the machine during the ritual (camera stays free).
  tether-player: true
  tether-radius: 1.5
  # Nearby spectators see the ritual boss bar too.
  spectator-bossbar: true
  # Nearby spectators get short action-bar narration ("Steve offers 64 Diamond…").
  narrate-to-spectators: true
  # Fakeouts: before revealing a WIN, the Void sometimes pretends a lesser verdict.
  # They only ever end better than they pretended. The verdict is sealed before the
  # ritual starts — fakeouts are theatre, never truth.
  fakeouts:
    enabled: true
    # Chance per eligible ritual (0.0-1.0).
    chance: 0.08
    # A player sees at most one fakeout per this many rituals.
    min-rituals-between-per-player: 4
    # No two fakeouts on the whole server within this time.
    global-cooldown-seconds: 90
    patterns: [false-loss, escalation]
  # Who hears about big results: none | area (spectators) | server (chat broadcast).
  announce:
    win: none
    great: area
    jackpot: server
    server-cooldown-seconds: 30

# -----------------------------------------------------------------------------
#  Spectators — the machine becomes more dramatic when people gather.
# -----------------------------------------------------------------------------
spectators:
  # inner: full experience | near: atmosphere | far: only the big moments.
  inner-radius: 6
  near-radius: 14
  far-radius: 28
  # How often the audience is re-scanned (ticks).
  refresh-ticks: 10
  crowd:
    # Onlookers (not counting the offering player) before the intensity rises.
    min-for-bonus: 2
    # Strongest intensity multiplier for particles and volume (1.0-3.0).
    max-intensity: 1.6
    # Onlookers at which max-intensity is reached.
    full-at: 6

# -----------------------------------------------------------------------------
#  Idle machines breathe
# -----------------------------------------------------------------------------
ambient:
  enabled: true
  # Only animate idle machines that have a player within this radius.
  radius: 24
  # Rare surges on an idle machine ("The Void grows restless…").
  void-events:
    enabled: true
    min-interval-minutes: 10
    max-interval-minutes: 45

# -----------------------------------------------------------------------------
#  Delivery of rewards
# -----------------------------------------------------------------------------
delivery:
  # What happens to a reward that does not fit in the inventory:
  #   hold — the Void keeps it safely (survives restarts and crashes) and returns it
  #          automatically as soon as there is room. Players can also use /vm claim.
  #   drop — dropped at the player's feet, locked to them, never despawns. After the
  #          drop it follows normal Minecraft rules.
  overflow: hold
  # How often held rewards are retried for online players (seconds).
  retry-seconds: 5

# -----------------------------------------------------------------------------
#  Logging
# -----------------------------------------------------------------------------
logging:
  # quiet: warnings and errors only | info: one line per ritual | debug: everything
  level: info
  audit:
    # Structured JSON-lines audit trail in plugins/VoidMachine/audit/
    enabled: true
    # Days of audit files to keep (0 = keep forever).
    retention-days: 30

# -----------------------------------------------------------------------------
#  Statistics (/vm stats, /vm top)
# -----------------------------------------------------------------------------
stats:
  enabled: true
  save-interval-seconds: 60
